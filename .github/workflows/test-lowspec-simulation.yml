name: Low-Spec Hardware Simulation Test (1GHz CPU + 512MB RAM)

on:
  push:
    branches: [ FreeCut109.exe, main ]
  workflow_dispatch:

jobs:
  simulate-lowspec:
    name: Test on Simulated 1GHz CPU + 512MB RAM + SwiftShader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build web application
        run: vp build
        env:
          VITE_BASE_URL: '/'

      - name: Run Throttled Headless Test Suite (10x CPU Throttling)
        run: |
          # Enforce 512MB V8 Heap limit & pass CPU Throttling flags to Playwright/Chrome
          NODE_OPTIONS="--max-old-space-size=512" FREECUT_CPU_THROTTLE_RATE="10" npm run headless:test:portable
