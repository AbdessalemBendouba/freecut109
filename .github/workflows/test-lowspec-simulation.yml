name: Low-Spec Hardware Simulation Test (512MB RAM Cap)

on:
  push:
    branches: [ FreeCut109.exe, main ]
  workflow_dispatch:

jobs:
  simulate-lowspec:
    name: Test on Simulated 32-bit 512MB RAM + SwiftShader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build web application
        run: vp build
        env:
          VITE_BASE_URL: '/'

      - name: Run Portable Headless Contract & Memory Suite
        run: |
          # Run FREE Cut's headless smoke test with strict V8 memory limits
          NODE_OPTIONS="--max-old-space-size=512" npm run headless:test:portable
