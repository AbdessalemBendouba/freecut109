name: Build FreeCut NW.js Native App (Win7 32-bit)

on:
  push:
    branches: [ FreeCut109.exe, main ]
  workflow_dispatch:

jobs:
  build-nwjs:
    name: Build NW.js 32-bit Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build web application
        run: vp build
        env:
          VITE_BASE_URL: './'

      - name: Create NW.js manifest (package.json)
        run: |
          cat << 'EOF' > dist/package.json
          {
            "name": "freecut109",
            "version": "1.0.0",
            "main": "index.html",
            "window": {
              "title": "FreeCut109 Video Editor",
              "icon": "favicon.svg",
              "width": 1280,
              "height": 768,
              "min_width": 1024,
              "min_height": 600,
              "position": "center",
              "toolbar": false
            },
            "chromium-args": "--enable-features=SharedArrayBuffer --ignore-gpu-blocklist --enable-gpu-rasterization --enable-zero-copy"
          }
          EOF

      - name: Download and package NW.js v0.72.0 (Win 32-bit)
        run: |
          # Download official NW.js 0.72.0 (Chromium 109 Win 32-bit)
          curl -sL https://dl.nwjs.io/v0.72.0/nwjs-v0.72.0-win-ia32.zip -o nwjs.zip
          unzip -q nwjs.zip
          mv nwjs-v0.72.0-win-ia32 FreeCut109-Win7-32bit

          # Copy built dist web files into NW.js root directory
          cp -r dist/* FreeCut109-Win7-32bit/

          # Rename executable to FreeCut.exe
          mv FreeCut109-Win7-32bit/nw.exe FreeCut109-Win7-32bit/FreeCut.exe

          # Create final ZIP archive
          zip -r FreeCut109-Win7-32bit.zip FreeCut109-Win7-32bit/

      - name: Upload Desktop App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut109-Win7-32bit
          path: FreeCut109-Win7-32bit.zip
          retention-days: 30
